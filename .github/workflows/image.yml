name: Image

# Builds one project's Docker image for linux/amd64 and linux/arm64 and
# publishes it as ghcr.io/nafiz001/<image>, tagged latest and sha-<commit>.
#
# Each platform builds on its own native runner, not under QEMU, so Rust and
# .NET compile at full speed. The two builds are pushed by digest and then
# joined under one tag, which is what lets the same compose file run on the
# AMD micro server and the Ampere one.
#
# Called from each project's repository:
#
#   jobs:
#     image:
#       uses: Nafiz001/portfolio-deploy/.github/workflows/image.yml@main
#       with:
#         image: ebru

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/nafiz001
        required: true
        type: string
      context:
        description: Build context, relative to the calling repository
        type: string
        default: .
      file:
        description: Dockerfile, relative to the context
        type: string
        default: Dockerfile

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/nafiz001/${{ inputs.image }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the platform
        id: platform
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.image }}-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ steps.platform.outputs.pair }}

      - name: Keep the digest for the merge job
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.image }}-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Join the platforms under one tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY_IMAGE@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "$REGISTRY_IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
